services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: liteflow
      POSTGRES_USER: liteflow
      POSTGRES_PASSWORD: dev123
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U liteflow -d liteflow"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
